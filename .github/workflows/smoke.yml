name: Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # Exercise the binary the way a user would, in a throwaway repo.
      - name: help
        run: bin/carrot-handoff help

      # `init` is the first command anyone runs in a new repo, so it is the one
      # most worth asserting end to end: note, wiring, and staging together. Run
      # twice, because idempotency is the property that regresses silently — the
      # first byte-identical regression shipped a spec that counted lines.
      - name: init wires the repo, and twice does no harm
        run: |
          mkdir -p "$RUNNER_TEMP/started"
          cd "$RUNNER_TEMP/started"
          git init --quiet
          git config user.email ci@example.com
          git config user.name CI
          printf '# Fresh project\n' > AGENTS.md
          "$GITHUB_WORKSPACE/bin/carrot-handoff" init "Start something"
          "$GITHUB_WORKSPACE/bin/carrot-handoff" status
          before="$(md5sum AGENTS.md)"
          "$GITHUB_WORKSPACE/bin/carrot-handoff" init
          "$GITHUB_WORKSPACE/bin/carrot-handoff" init
          after="$(md5sum AGENTS.md)"
          if [ "$before" != "$after" ]; then
            echo "init is not idempotent: AGENTS.md changed on re-run"
            exit 1
          fi
          git commit --quiet -m "add handoff note"

      - name: save and load round trip
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          git init --quiet
          git config user.email ci@example.com
          git config user.name CI
          echo hello > file.txt
          git add -A
          git commit --quiet -m "first"
          "$GITHUB_WORKSPACE/bin/carrot-handoff" save "CI smoke test"
          "$GITHUB_WORKSPACE/bin/carrot-handoff" status
          "$GITHUB_WORKSPACE/bin/carrot-handoff" load

      # Outside a repository `save` succeeds and warns that the note will not
      # survive a machine swap. It has warned-and-exited-0 since adeaf6d, which
      # is why this step asserted the opposite and has been red on main since.
      # The assertion is on the warning, not the exit status.
      - name: warns outside a repository instead of failing
        run: |
          cd "$RUNNER_TEMP"
          output="$("$GITHUB_WORKSPACE/bin/carrot-handoff" save "x")"
          echo "$output"
          case "$output" in
            *"no git repository here"*) ;;
            *) echo "expected a no-repository warning"; exit 1 ;;
          esac
